<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Yogesh Sikhwal, aspiring AI engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.5" stop-color="#0a1f2b"/>
      <stop offset="1" stop-color="#150d24"/>
    </linearGradient>

    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#00FFA3"/>
      <stop offset="0.33" stop-color="#00C2FF"/>
      <stop offset="0.66" stop-color="#FF4DC4"/>
      <stop offset="1" stop-color="#00FFA3"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00FFA3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00FFA3" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00FFA3" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>

    <clipPath id="clip"><rect width="1200" height="320" rx="18"/></clipPath>

    <g id="net">
      <g stroke="#00C2FF" stroke-opacity="0.38" stroke-width="1.4" fill="none" stroke-dasharray="6 8">
        <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="2s" repeatCount="indefinite"/>
        <path d="M70 70L160 150M160 150L90 240M70 70L250 80M160 150L250 80M160 150L270 230M90 240L270 230M250 80L350 160M270 230L350 160M160 150L350 160M40 160L160 150M40 160L70 70M40 160L90 240"/>
      </g>
      <g fill="#00FFA3">
        <circle cx="70" cy="70" r="4"><animate attributeName="r" values="4;7;4" dur="2.6s" begin="0s" repeatCount="indefinite"/></circle>
        <circle cx="160" cy="150" r="5"><animate attributeName="r" values="5;8;5" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
        <circle cx="90" cy="240" r="4"><animate attributeName="r" values="4;7;4" dur="2.6s" begin="0.8s" repeatCount="indefinite"/></circle>
        <circle cx="250" cy="80" r="4"><animate attributeName="r" values="4;7;4" dur="2.6s" begin="1.2s" repeatCount="indefinite"/></circle>
        <circle cx="270" cy="230" r="5"><animate attributeName="r" values="5;8;5" dur="2.6s" begin="1.6s" repeatCount="indefinite"/></circle>
        <circle cx="350" cy="160" r="4"><animate attributeName="r" values="4;7;4" dur="2.6s" begin="2s" repeatCount="indefinite"/></circle>
        <circle cx="40" cy="160" r="3"><animate attributeName="r" values="3;6;3" dur="2.6s" begin="2.3s" repeatCount="indefinite"/></circle>
      </g>
      <g fill="#FF4DC4" opacity="0.9">
        <circle cx="160" cy="150" r="2"/>
        <circle cx="270" cy="230" r="2"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <g clip-path="url(#clip)">
    <rect x="0" y="-80" width="1200" height="80" fill="url(#scan)">
      <animate attributeName="y" from="-80" to="320" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <use xlink:href="#net" href="#net"/>
  <use xlink:href="#net" href="#net" transform="translate(1200 0) scale(-1 1)"/>

  <g font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="30" fill="#ffffff" fill-opacity="0.16">
    <text x="425" y="75">{ }<animate attributeName="y" values="75;65;75" dur="5s" repeatCount="indefinite"/></text>
    <text x="745" y="70">&lt;/&gt;<animate attributeName="y" values="70;80;70" dur="6s" repeatCount="indefinite"/></text>
    <text x="480" y="290">λ<animate attributeName="y" values="290;280;290" dur="4.5s" repeatCount="indefinite"/></text>
    <text x="705" y="292">∑<animate attributeName="y" values="292;282;292" dur="5.5s" repeatCount="indefinite"/></text>
    <text x="835" y="45">∇<animate attributeName="y" values="45;55;45" dur="4s" repeatCount="indefinite"/></text>
    <text x="345" y="45">01<animate attributeName="y" values="45;55;45" dur="6.5s" repeatCount="indefinite"/></text>
  </g>

  <text x="600" y="108" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="18" fill="#00C2FF" fill-opacity="0.85">&lt; hello, world /&gt;</text>

  <text x="600" y="172" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="7" fill="url(#flow)" filter="url(#glow)">YOGESH SIKHWAL</text>

  <text x="600" y="215" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" letter-spacing="9" fill="#c9d1d9">AI ENGINEER IN THE MAKING</text>

  <circle cx="470" cy="256" r="5" fill="#00FFA3">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;8;5" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="488" y="262" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="16" fill="#8b949e" textLength="250" lengthAdjust="spacing">open to AI/ML internships</text>

  <rect x="1.5" y="1.5" width="1197" height="317" rx="17" fill="none" stroke="url(#flow)" stroke-width="2" stroke-opacity="0.75"/>
</svg>
