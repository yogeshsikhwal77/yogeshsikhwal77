<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Thanks for visiting" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150d24"/>
      <stop offset="0.5" stop-color="#0a1f2b"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>

    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#00FFA3"/>
      <stop offset="0.33" stop-color="#00C2FF"/>
      <stop offset="0.66" stop-color="#FF4DC4"/>
      <stop offset="1" stop-color="#00FFA3"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>

    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="clip"><rect width="1200" height="240" rx="18"/></clipPath>
  </defs>

  <rect width="1200" height="240" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="240" rx="18" fill="url(#grid)"/>

  <g clip-path="url(#clip)">
    <!-- rising particles -->
    <g fill="#00FFA3">
      <circle cx="90" cy="230" r="2.5" opacity="0"><animate attributeName="cy" from="230" to="20" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="230" r="2" opacity="0"><animate attributeName="cy" from="230" to="20" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="230" r="3" opacity="0"><animate attributeName="cy" from="230" to="20" dur="7s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" begin="2s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#00C2FF">
      <circle cx="610" cy="230" r="2" opacity="0"><animate attributeName="cy" from="230" to="20" dur="9s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="230" r="3" opacity="0"><animate attributeName="cy" from="230" to="20" dur="6.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="6.5s" begin="3s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#FF4DC4">
      <circle cx="940" cy="230" r="2.5" opacity="0"><animate attributeName="cy" from="230" to="20" dur="7.5s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="230" r="2" opacity="0"><animate attributeName="cy" from="230" to="20" dur="8.5s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8.5s" begin="2.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- flowing waves -->
    <path fill="#FF4DC4" fill-opacity="0.16" d="M0,170 C200,130 400,210 600,170 S1000,130 1200,170 L1200,240 L0,240 Z">
      <animate attributeName="d" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
        values="M0,170 C200,130 400,210 600,170 S1000,130 1200,170 L1200,240 L0,240 Z;M0,170 C200,210 400,130 600,170 S1000,210 1200,170 L1200,240 L0,240 Z;M0,170 C200,130 400,210 600,170 S1000,130 1200,170 L1200,240 L0,240 Z"/>
    </path>
    <path fill="#00C2FF" fill-opacity="0.18" d="M0,190 C200,230 400,150 600,190 S1000,230 1200,190 L1200,240 L0,240 Z">
      <animate attributeName="d" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
        values="M0,190 C200,230 400,150 600,190 S1000,230 1200,190 L1200,240 L0,240 Z;M0,190 C200,150 400,230 600,190 S1000,150 1200,190 L1200,240 L0,240 Z;M0,190 C200,230 400,150 600,190 S1000,230 1200,190 L1200,240 L0,240 Z"/>
    </path>
    <path fill="#00FFA3" fill-opacity="0.22" d="M0,208 C200,188 400,228 600,208 S1000,188 1200,208 L1200,240 L0,240 Z">
      <animate attributeName="d" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
        values="M0,208 C200,188 400,228 600,208 S1000,188 1200,208 L1200,240 L0,240 Z;M0,208 C200,228 400,188 600,208 S1000,228 1200,208 L1200,240 L0,240 Z;M0,208 C200,188 400,228 600,208 S1000,188 1200,208 L1200,240 L0,240 Z"/>
    </path>
  </g>

  <!-- terminal line -->
  <text x="305" y="92" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="22" fill="url(#flow)" filter="url(#glow)" textLength="570" lengthAdjust="spacing">$ while alive; do learn &amp;&amp; build &amp;&amp; ship; done</text>
  <rect x="884" y="73" width="12" height="24" fill="#00FFA3">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="132" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" letter-spacing="3" fill="#8b949e">THANKS FOR STOPPING BY  ·  ★ A REPO IF YOU LIKED SOMETHING</text>

  <rect x="1.5" y="1.5" width="1197" height="237" rx="17" fill="none" stroke="url(#flow)" stroke-width="2" stroke-opacity="0.75"/>
</svg>
